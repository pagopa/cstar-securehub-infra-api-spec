      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MessageDTOV1'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer
    MessageDTOV1:
