openapi: 3.0.3
info:
  title: backoffice-bff-internal
  description: Internal backoffice API for PagoPA operators. Access requires a valid Keycloak token issued by the internal client with an operator role (operator-read, operator-write, or operator-admin).
  version: v0.1.0
servers:
  - url: https://api-emd.dev.cstar.pagopa.it/emd/backoffice-internal
    description: Internal backoffice base URL
    x-internal: true
paths:
  '/api/v1/tpp/{entityId}':
    get:
      tags:
        - tpp-backoffice-internal
      operationId: getTppByEntityId
      summary: Retrieve TPP details by entityId
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the entity
        - name: detailed
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Flag to include detailed fields in response
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppResponseDTOV1'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  '/api/v1/tpp/search':
    get:
      tags:
        - tpp-backoffice-internal
      operationId: getSearchTpp
      summary: Search TPPs with filters — accessible by any operator role
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: businessName
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppSearchResponseDTO'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
  '/api/v1/tpp/{tppId}/state':
    put:
      tags:
        - tpp-backoffice-internal
      operationId: updateTppState
      summary: Update TPP state
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the TPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TppDTOWithoutTokenSectionV1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppResponseDTOV1'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: TPP Not Found
  '/api/v1/tpp/{tppId}/payment-enabled':
    put:
      tags:
        - tpp-backoffice-internal
      operationId: updateTppIsPaymentEnabled
      summary: Updates the TPP's ability to execute the payment
      description: This flag determines if the TPP is allowed to perform payment operations.
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Internal identifier of the TPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TppUpdateIsPaymentEnabledDTOV1'
      responses:
        '204':
          description: No Content - Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: TPP Not Found
        '502':
          description: Bad Gateway - Downstream service unreachable
  '/api/v1/tpp/{tppId}/whitelist':
    post:
      tags:
        - tpp-backoffice-internal
      operationId: insertRecipientIdOnWhitelist
      summary: Adds a recipient ID to the whitelist of a specific TPP
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the TPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientIdOnWhitelistDTOV1'
      responses:
        '201':
          description: Created - Recipient added successfully
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: TPP Not Found
        '409':
          description: Conflict - Recipient already present in whitelist
        '502':
          description: Bad Gateway - Downstream service unreachable
    put:
      tags:
        - tpp-backoffice-internal
      operationId: updateRecipientIdOnWhitelist
      summary: Replace the entire whitelist of a specific TPP
      description: Destructive operation. All previous whitelist entries will be replaced by the new list.
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the TPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: List of new recipientIds to set on the whitelist
      responses:
        '204':
          description: No Content - Whitelist replaced successfully
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: TPP Not Found
        '502':
          description: Bad Gateway - Downstream service unreachable
  '/api/v1/tpp/{tppId}/whitelist/{recipientId}':
    delete:
      tags:
        - tpp-backoffice-internal
      operationId: removeRecipientIdOnWhitelist
      summary: Removes a recipient ID from the whitelist of a specific TPP
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the TPP
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the recipient to remove
      responses:
        '204':
          description: No Content - Recipient removed successfully
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: TPP or Recipient Not Found
        '502':
          description: Bad Gateway - Downstream service unreachable
  '/api/v1/tpp/{tppId}/network/connection/test':
    get:
      tags:
        - tpp-backoffice-internal
      operationId: testAuthConnection
      summary: Test TPP authentication connectivity
      description: Triggers a real-time network and authentication check towards the TPP's configured authorization server to verify if the credentials and connectivity are valid.
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the TPP to test
      responses:
        '200':
          description: OK - Test performed successfully (results are in the body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppConnectionResponseDTOV1'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: TPP Not Found
        '502':
          description: Bad Gateway - Downstream service unreachable
  '/api/v1/citizen/search':
    get:
      tags:
        - citizen-backoffice-internal
      operationId: getSearchCitizen
      summary: Search registered citizens by fiscal code using cursor-based pagination
      description: >
        Performs keyset/cursor-based pagination; this operation does not use page-number or offset pagination.
        The BFF normalizes fiscalCode and cursor to uppercase using Locale.ROOT before forwarding them.
        For subsequent pages, send the previous response's nextCursor as cursor; omit cursor on the first page.
        totalElements and totalPages describe the full matching result set, not only results after the cursor;
        totalPages is calculated by Citizen and propagated by the BFF without recalculation.
      parameters:
        - name: fiscalCode
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 16
            pattern: '^[A-Za-z0-9]{3,16}$'
          description: >
            Required search value: 3–16 ASCII alphanumeric characters only (A–Z, a–z, 0–9); spaces and symbols
            are not allowed. If exactly 16 characters, it must additionally match the complete fiscal-code pattern
            ^[A-Za-z]{6}[0-9]{2}[A-Za-z]{1}[0-9]{2}[A-Za-z]{1}[0-9]{3}[A-Za-z]{1}$. Shorter values are not
            subject to that positional pattern. Invalid values produce 400 Bad Request in the standard BFF error format.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 16
            pattern: '^[A-Za-z0-9]{16}$'
          description: >
            Omit for the first page. For each subsequent page, pass the previous response's nextCursor unchanged.
            The BFF requires exactly 16 ASCII alphanumeric characters and a prefix consistent with fiscalCode,
            case-insensitively. Do not apply the positional fiscal-code pattern to the cursor; the BFF normalizes
            it to uppercase and does not reconstruct or reinterpret it. Invalid or inconsistent cursors produce
            400 Bad Request in the standard BFF error format.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
          description: Page size, from 1 to 100 inclusive; defaults to 10. Non-integer or out-of-range values produce 400 Bad Request.
      responses:
        '200':
          description: OK - Citizen search results for the requested page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenSearchResponseDTOV1'
        '400':
          description: Bad Request - Invalid fiscalCode, cursor, or size; returned in the standard BFF error format
        '401':
          description: Unauthorized - missing or invalid internal Keycloak token
        '403':
          description: Forbidden - insufficient operator role
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway - downstream service unavailable
        '429':
          description: Too Many Requests - product rate limit exceeded
  '/api/v1/citizen/consent/search':
    post:
      tags:
        - citizen-backoffice-internal
      operationId: postSearchCitizenConsents
      summary: Search consents for a single citizen
      description: >
        Searches for a citizen's consents. The fiscalCode is sent in the JSON request body, never in the path
        or query string. The BFF accepts uppercase and lowercase letters and normalizes the fiscalCode to
        uppercase before forwarding it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenConsentSearchRequestDTOV1'
            example:
              fiscalCode: RSSMRA85T10A562S
      responses:
        '200':
          description: OK - Consent search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenConsentSearchResponseDTOV1'
              example:
                fiscalCode: RSSMRA85T10A562S
                consents:
                  TPP_XYZ_123:
                    tppState: true
                    tcDate: '2025-10-17T13:18:37.313'
                    entityId: entity-123
                    businessName: Nome Azienda TPP
        '400':
          description: Bad Request - fiscalCode is missing, empty, malformed, or rejected by Citizen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: BAD_REQUEST
                message: Invalid request
                traceId: trace-id
        '401':
          description: Unauthorized - missing or invalid internal Keycloak token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: Not Found - citizen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: NOT_FOUND
                message: Citizen not found
                traceId: trace-id
        '429':
          description: Too Many Requests - product rate limit exceeded
        '502':
          description: Bad Gateway - upstream, network, or response-decoding failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                code: GENERIC_ERROR
                message: The request could not be completed
                traceId: trace-id
  '/api/v1/citizen/{fiscalCode}/consents/{tppId}':
    put:
      tags:
        - citizen-backoffice-internal
      operationId: toggleCitizenConsent
      summary: Toggle a citizen's consent for a TPP
      description: >
        Each successful call toggles the existing consent state and updates tcDate. tppState is true when
        the consent is enabled and false when it is disabled. This operation has no request body and is
        restricted to operator-write and operator-admin roles.
      parameters:
        - name: fiscalCode
          in: path
          required: true
          schema:
            type: string
          description: Fiscal code of the citizen
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the TPP whose consent is toggled
      responses:
        '200':
          description: OK - Consent state toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenConsentToggleResponseDTOV1'
              example:
                fiscalCode: RSSMRA85T10A562S
                consents:
                  TPP_XYZ_123:
                    tppState: true
                    tcDate: '2025-10-17T13:18:37.313'
        '401':
          description: Unauthorized - missing or invalid internal Keycloak token
        '403':
          description: Forbidden - operator-write or operator-admin role required
        '404':
          description: Not Found - citizen or consent for the specified TPP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '429':
          description: Too Many Requests - product rate limit exceeded
  '/api/v1/message-core/{entityId}/{messageId}':
    get:
      tags:
        - message-backoffice-internal
      operationId: getMessageByEntityIdAndMessageId
      summary: Retrieve a Message by its messageId
      description: Checks whether a Message with the given messageId exists and returns its details.
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the tpp
        - name: messageId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the message
      responses:
        '200':
          description: OK - Message details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTOV1'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: Not Found - No Message exists for the given messageId
        '502':
          description: Bad Gateway - Downstream service unreachable
    delete:
      tags:
        - message-backoffice-internal
      operationId: deleteMessageByEntityIdAndMessageId
      summary: Delete a Message by entityId and messageId
      description: Permanently removes a message associated with a specific entity (TPP) and message ID. Requires operator-write or operator-admin roles.
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the entity (TPP)
        - name: messageId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the message to delete
      responses:
        '204':
          description: No Content - Message deleted successfully
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: Not Found - No Message exists for the given entityId and messageId
        '502':
          description: Bad Gateway - Downstream service unreachable
  '/api/v1/message-core/search':
    get:
      tags:
        - message-backoffice-internal
      operationId: getSearchMessage
      summary: Performs a paginated search for Messages
      description: >
        At least one filter (messageId, recipientId, or originId) or a date range (startDate and endDate)
        should be provided for meaningful results.
      parameters:
        - name: messageId
          in: query
          required: false
          schema:
            type: string
          description: Exact match filter on the message ID
        - name: recipientId
          in: query
          required: false
          schema:
            type: string
          description: Exact match filter on the recipient ID
        - name: originId
          in: query
          required: false
          schema:
            type: string
          description: Exact match filter on the origin ID
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: Start date for message registration period
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: End date for message registration period
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Page size (upstream cap 100)
        - name: fields
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Optional list of field names to include in each result element
      responses:
        '200':
          description: OK - Paginated list of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSearchResponseDTOV1'
        '400':
          description: Bad Request - Invalid field name or parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - insufficient operator role
        '502':
          description: Bad Gateway - Upstream emd-tpp service is unavailable
components:
  schemas:
    CitizenConsentSearchRequestDTOV1:
      type: object
      required:
        - fiscalCode
      properties:
        fiscalCode:
          type: string
          pattern: '^[A-Za-z]{6}[0-9]{2}[A-Za-z][0-9]{2}[A-Za-z][0-9]{3}[A-Za-z]$'
          description: >
            Full Italian fiscal code. The BFF accepts uppercase or lowercase letters, rejects missing, empty,
            or malformed values with 400 Bad Request, and normalizes valid values to uppercase before forwarding.
            No checksum validation is performed.
          example: RSSMRA85T10A562S
    CitizenConsentSearchResponseDTOV1:
      type: object
      description: Consent search result returned by the BFF without reshaping the upstream response.
      properties:
        fiscalCode:
          type: string
          example: RSSMRA85T10A562S
        consents:
          type: object
          description: Map keyed by TPP ID; an empty map is represented as an empty object.
          additionalProperties:
            $ref: '#/components/schemas/CitizenConsentDTOV1'
    CitizenConsentDTOV1:
      type: object
      properties:
        tppState:
          type: boolean
        tcDate:
          type: string
          description: LocalDateTime in ISO-8601 local date-time format, without a Z suffix or UTC offset.
          example: '2025-10-17T13:18:37.313'
        entityId:
          type: string
        businessName:
          type: string
    CitizenConsentToggleResponseDTOV1:
      type: object
      description: Consent state returned for the requested citizen and TPP.
      properties:
        fiscalCode:
          type: string
        consents:
          type: object
          description: Map keyed by TPP ID and limited to the requested TPP; an empty map is represented as {}.
          additionalProperties:
            $ref: '#/components/schemas/CitizenConsentToggleDTOV1'
    CitizenConsentToggleDTOV1:
      type: object
      properties:
        tppState:
          type: boolean
          description: True when the consent is enabled; false when disabled.
        tcDate:
          type: string
          description: LocalDateTime in ISO-8601 local date-time format, without a Z suffix or UTC offset.
          example: '2025-10-17T13:18:37.313'
    ErrorDTO:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    CitizenSearchResponseDTOV1:
      type: object
      description: Cursor-based page of registered citizens matching the requested fiscal-code search.
      required:
        - content
        - pageSize
        - totalElements
        - totalPages
        - nextCursor
        - hasNext
      properties:
        content:
          type: array
          description: Results for this page; may be empty.
          maxItems: 100
          items:
            $ref: '#/components/schemas/CitizenSearchResultDTOV1'
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Number of results in a page.
          example: 10
        totalElements:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Total matching elements for fiscalCode across the entire result set, irrespective of cursor.
          example: 34
        totalPages:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Total pages for the entire result set, calculated by Citizen and propagated unchanged by the BFF.
          example: 4
        nextCursor:
          type: string
          nullable: true
          minLength: 16
          maxLength: 16
          pattern: '^[A-Za-z0-9]{16}$'
          description: Cursor value to pass as cursor in the next request; null when there is no next cursor.
          example: RSS11111L04L741X
        hasNext:
          type: boolean
          description: Indicates whether another page is available.
          example: true
    CitizenSearchResultDTOV1:
      type: object
      description: A registered fiscal code and its associated consent count.
      required:
        - fiscalCode
        - consentCount
      properties:
        fiscalCode:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^[A-Za-z]{6}[0-9]{2}[A-Za-z]{1}[0-9]{2}[A-Za-z]{1}[0-9]{3}[A-Za-z]{1}$'
          description: Registered Codice Fiscale.
          example: RSS11111L04L741X
        consentCount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Total number of consents associated with this fiscal code.
          example: 1
    TppSearchResponseDTO:
      type: object
      description: Paginated list of TPP results
      properties:
        content:
          type: array
          items:
            type: object
        totalElements:
          type: integer
          minimum: 0
          maximum: 2147483647
        totalPages:
          type: integer
          minimum: 0
          maximum: 2147483647
        page:
          type: integer
          minimum: 0
          maximum: 2147483647
        size:
          type: integer
          minimum: 1
          maximum: 100
    TppResponseDTOV1:
      type: object
      description: TPP response data transfer object
      required:
        - tppId
        - businessName
        - messageUrl
        - contact
        - pspDenomination
        - agentLinks
      properties:
        # Base fields
        tppId:
          type: string
        businessName:
          type: string
        messageUrl:
          type: string
        contact:
          $ref: '#/components/schemas/ContactV1'
        pspDenomination:
          type: string
        agentLinks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentLinkV1'
        # Detailed-only fields
        entityId:
          type: string
        clientId:
          type: string
        idPsp:
          type: string
        legalAddress:
          type: string
        state:
          type: boolean
        creationDate:
          type: string
          format: date-time
        lastUpdateDate:
          type: string
          format: date-time
        isPaymentEnabled:
          type: boolean
        messageTemplate:
          type: string
        whitelistRecipient:
          type: array
          items:
            type: string
    ContactV1:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
    AgentLinkV1:
      type: object
      properties:
        agentId:
          type: string
        url:
          type: string
    TppUpdateStateDTOV1:
      type: object
      description: Data Transfer Object for updating the operational state of a TPP
      required:
        - state
      properties:
        tppId:
          type: string
        state:
          type: boolean
          description: New state of the TPP
    TppDTOWithoutTokenSectionV1:
      type: object
      description: API-layer representation of a TPP (Token section excluded)
      properties:
        tppId:
          type: string
        clientId:
          type: string
        entityId:
          type: string
        idPsp:
          type: string
        businessName:
          type: string
        legalAddress:
          type: string
        messageUrl:
          type: string
        authenticationUrl:
          type: string
        authenticationType:
          $ref: '#/components/schemas/AuthenticationTypeV1'
        contact:
          $ref: '#/components/schemas/ContactV1'
        state:
          type: boolean
        creationDate:
          type: string
          format: date-time
        lastUpdateDate:
          type: string
          format: date-time
        pspDenomination:
          type: string
        agentLinks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentLinkV1'
        isPaymentEnabled:
          type: boolean
        messageTemplate:
          type: string
        whitelistRecipient:
          type: array
          items:
            type: string
    TppUpdateIsPaymentEnabledDTOV1:
      type: object
      description: Data Transfer Object for updating the payment authorization of a TPP
      required:
        - isPaymentEnabled
      properties:
        isPaymentEnabled:
          type: boolean
          description: Flag to enable or disable payment execution
    RecipientIdOnWhitelistDTOV1:
      type: object
      description: Data Transfer Object containing the recipient identifier to be added to the whitelist
      required:
        - recipientId
      properties:
        recipientId:
          type: string
          description: The identifier of the recipient
    AuthenticationTypeV1:
      type: string
      enum: [OAUTH2]
    TppConnectionResponseDTOV1:
      type: object
      description: Result of the TPP connectivity and authentication test
      properties:
        status:
          type: string
          description: High-level result of the test (e.g., SUCCESS, FAILURE, ERROR)
          example: "SUCCESS"
        errorType:
          type: string
          description: Categorization of the error (populated only if status is not SUCCESS)
          example: "HTTP_ERROR"
        httpStatus:
          type: integer
          description: HTTP status code returned by the external TPP server
          example: 200
        description:
          type: string
          description: Human-readable description of the test result or error details
          example: "Connection established successfully"
    MessageSearchResponseDTOV1:
      type: object
