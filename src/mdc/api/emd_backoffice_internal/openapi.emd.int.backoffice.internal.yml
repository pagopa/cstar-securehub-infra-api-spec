        messageUrl:
          type: string
        originId:
          type: string
        title:
          type: string
        content:
          type: string
        associatedPayment:
          type: boolean
        analogSchedulingDate:
          type: string
        channel:
          $ref: '#/components/schemas/ChannelV1'
        workflowType:
          $ref: '#/components/schemas/WorkflowTypeV1'
        idPsp:
