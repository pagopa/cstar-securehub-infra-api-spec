openapi: 3.0.3
info:
  title: backoffice-bff-internal
  description: Internal backoffice API for PagoPA operators. Access requires a valid Keycloak token issued by the internal client with an operator role (operator-read, operator-write, or operator-admin).
  version: v0.1.0
servers:
  - url: https://api-emd.dev.cstar.pagopa.it/emd/backoffice-internal
    description: Internal backoffice base URL
    x-internal: true
paths:
  '/api/v1/tpp/{entityId}':
    get:
      tags:
        - tpp-backoffice-internal
      operationId: getTppByEntityId
      summary: Retrieve TPP details by entityId
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the entity
        - name: detailed
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Flag to include detailed fields in response
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppResponseDTOV1'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  '/api/v1/tpp/search':
    get:
      tags:
        - tpp-backoffice-internal
      operationId: getSearchTpp
      summary: Search TPPs with filters — accessible by any operator role
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: businessName
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppSearchResponseDTO'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
  '/api/v1/tpp/{tppId}/state':
    put:
      tags:
        - tpp-backoffice-internal
      operationId: updateTppState
      summary: Update TPP state
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the TPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TppDTOWithoutTokenSectionV1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppResponseDTOV1'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - insufficient operator role
        '404':
          description: TPP Not Found
  '/api/v1/tpp/{tppId}/payment-enabled':
    put:
      tags:
        - tpp-backoffice-internal
      operationId: updateTppIsPaymentEnabled
      summary: Updates the TPP's ability to execute the payment
      description: This flag determines if the TPP is allowed to perform payment operations.
      parameters:
        - name: tppId
          in: path
          required: true
          schema:
            type: string
          description: Internal identifier of the TPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TppUpdateIsPaymentEnabledDTOV1'
      responses:
        '204':
          description: No Content - Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: TPP Not Found
        '502':
          description: Bad Gateway - Downstream service unreachable
components:
  schemas:
    TppSearchResponseDTO:
      type: object
      description: Paginated list of TPP results
      properties:
        content:
          type: array
          items:
            type: object
        totalElements:
          type: integer
          minimum: 0
          maximum: 2147483647
        totalPages:
          type: integer
          minimum: 0
          maximum: 2147483647
        page:
          type: integer
          minimum: 0
          maximum: 2147483647
        size:
          type: integer
          minimum: 1
          maximum: 100
    TppResponseDTOV1:
      type: object
      description: TPP response data transfer object
      required:
        - tppId
        - businessName
        - messageUrl
        - contact
        - pspDenomination
        - agentLinks
      properties:
        # Base fields
        tppId:
          type: string
        businessName:
          type: string
        messageUrl:
          type: string
        contact:
          $ref: '#/components/schemas/ContactV1'
        pspDenomination:
          type: string
        agentLinks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentLinkV1'
        # Detailed-only fields
        entityId:
          type: string
        clientId:
          type: string
        idPsp:
          type: string
        legalAddress:
          type: string
        state:
          type: boolean
        creationDate:
          type: string
          format: date-time
        lastUpdateDate:
          type: string
          format: date-time
        isPaymentEnabled:
          type: boolean
        messageTemplate:
          type: string
        whitelistRecipient:
          type: array
          items:
            type: string
    TppDTOWithoutTokenSectionV1:
      type: object
      description: API-layer representation of a TPP (Token section excluded)
      properties:
        tppId:
          type: string
        clientId:
          type: string
        entityId:
          type: string
        idPsp:
          type: string
        businessName:
          type: string
        legalAddress:
          type: string
        messageUrl:
          type: string
        authenticationUrl:
          type: string
        authenticationType:
          $ref: '#/components/schemas/AuthenticationTypeV1'
        contact:
          $ref: '#/components/schemas/ContactV1'
        state:
          type: boolean
        creationDate:
          type: string
          format: date-time
        lastUpdateDate:
          type: string
          format: date-time
        pspDenomination:
          type: string
        agentLinks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentLinkV1'
        isPaymentEnabled:
          type: boolean
        messageTemplate:
          type: string
        whitelistRecipient:
          type: array
          items:
            type: string
    ContactV1:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
    AgentLinkV1:
      type: object
      properties:
        agentId:
          type: string
        url:
          type: string
    TppUpdateStateDTOV1:
      type: object
      description: Data Transfer Object for updating the operational state of a TPP
      required:
        - state
      properties:
        tppId:
          type: string
        state:
          type: boolean
          description: New state of the TPP
    TppUpdateIsPaymentEnabledDTOV1:
      type: object
      description: Data Transfer Object for updating the payment authorization of a TPP
      required:
        - isPaymentEnabled
      properties:
        isPaymentEnabled:
          type: boolean
          description: Flag to enable or disable payment execution
    AuthenticationTypeV1:
      type: string
      enum: [OAUTH2]
